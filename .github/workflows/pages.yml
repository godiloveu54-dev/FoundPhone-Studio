name: Validate build
on:
  push:
    branches: [main, feature/wechat-year-chat-history]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-validation
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build story data and site
        run: npm run story:build && npx vite build --config vite.runtime.config.ts && node scripts/package-runtime.mjs
